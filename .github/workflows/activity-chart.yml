name: Update Purple-Blue Contribution Heatmap

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_heatmap.py"
      - ".github/workflows/activity-chart.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate contribution calendar SVG
        run: python scripts/generate_heatmap.py
        env:
          GITHUB_USERNAME: AasthaRai0
          OUTPUT_FILE: assets/contribution-heatmap.svg

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-heatmap.svg
          git diff --cached --quiet || (git commit -m "Update contribution heatmap" && git push)
