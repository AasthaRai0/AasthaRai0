name: Update Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution chart
        uses: dturovskiy/deus-commit-chart@v1
        with:
          username: AasthaRai0
          token: ${{ github.token }}
          default-days: "365"
          ranges: "365"
          layout: spacious
          output-dir: activity-dist

      - name: Save generated chart
        run: |
          mkdir -p activity-assets
          cp activity-dist/activity-365d.svg activity-assets/contribution-graph.svg

      - name: Commit graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity-assets/contribution-graph.svg
          git diff --cached --quiet || (git commit -m "Update contribution graph" && git push)
